services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: incident_demo
      MYSQL_USER: incident_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-local_dev_only}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-local_root_only}
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
